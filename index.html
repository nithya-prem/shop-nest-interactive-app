<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest | E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">Shop<span>Nest</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products by name...">
        </div>
        <div class="nav-actions">
            <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="container">
        <!-- Category Filter Sidebar -->
        <aside class="filters">
            <h3>Categories</h3>
            <div id="categoryContainer" class="category-list">
                <button class="cat-btn active" data-category="All">All</button>
                <button class="cat-btn" data-category="Electronics">Electronics</button>
                <button class="cat-btn" data-category="Clothing">Clothing</button>
                <button class="cat-btn" data-category="Footwear">Footwear</button>
                <button class="cat-btn" data-category="Books">Books</button>
            </div>
        </aside>

        <!-- Product Listing Section -->
        <section class="product-section">
            <div id="loader" class="loader">Loading products...</div>
            <div id="productGrid" class="product-grid"></div>
        </section>
    </main>

    <!-- Cart Modal / Drawer -->
    <div id="cartModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-summary">
                <h3>Total: $<span id="cartTotal">0.00</span></h3>
                <button id="checkoutBtn" class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
